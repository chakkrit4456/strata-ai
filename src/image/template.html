<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  /* ค่าเริ่มต้น = ธีม Strata — renderPost() จะเขียนทับด้วยสีและฟอนต์ของธีมที่เลือก */
  :root {
    --bg: #0d0f12; --panel: #15181d; --line: #262a31; --text: #f2ece1; --muted: #8d939c;
    --accent: #5fe3b3; --accent2: #c9a35c; --on-accent: #08100c;
    --sans: 'IBM Plex Sans Thai', 'Noto Sans Thai', 'Tlwg Typist', sans-serif;
    --mono: 'JetBrains Mono', 'DejaVu Sans Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: var(--bg); }
  body { font-family: var(--sans); color: var(--text); overflow: hidden; }
  .canvas { position: relative; width: 1080px; height: 1350px; padding: 84px 84px 72px; display: flex; flex-direction: column; }

  /* ---------- พื้นหลัง ---------- */
  .bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .bg > * { position: absolute; }
  /* ภาพจาก AI: ขยายเล็กน้อยและชิดซ้ายบน เพื่อตัดลายน้ำมุมขวาล่างของบริการภาพฟรีออก */
  .photo { inset: 0; background-size: 118% auto; background-position: left top; }
  .photo-faint .photo { opacity: .24; }
  .photo-full .photo { opacity: 1; }
  .photo-full .shade { inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 55%, transparent) 0%, color-mix(in srgb, var(--bg) 88%, transparent) 55%, var(--bg) 100%); }
  .photo-card .photo { display: none; }
  .pic { display: none; }
  .photo-card .pic { display: block; align-self: stretch; height: 400px; border-radius: 22px; background-size: 118% auto; background-position: left top; border: 1.5px solid var(--line); }

  .decor-grid .d1 { inset: 0; opacity: .35; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 54px 54px; mask-image: radial-gradient(ellipse at 80% 20%, #000 0%, transparent 72%); }
  .decor-frame .d1 { inset: 0; opacity: .35; background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 54px 54px; mask-image: radial-gradient(ellipse at 80% 20%, #000 0%, transparent 70%); }
  .decor-frame .d2 { opacity: .6; right: -60px; top: 120px; width: 420px; height: 620px; border: 2px solid var(--line); border-right: 0; }
  .decor-frame .d3 { right: 84px; bottom: 180px; width: 34px; height: 34px; background: var(--accent2); opacity: .55; }
  .decor-dots .d1 { inset: 0; opacity: .5; background-image: radial-gradient(var(--line) 2.5px, transparent 2.6px); background-size: 36px 36px; mask-image: linear-gradient(200deg, #000 0%, transparent 60%); }
  .decor-dots .d2 { right: -120px; top: -120px; width: 460px; height: 460px; border-radius: 50%; background: var(--accent); opacity: .14; }
  .decor-gradient .d1 { inset: 0; background: radial-gradient(circle at 85% 10%, var(--accent) 0%, transparent 45%), radial-gradient(circle at 0% 100%, var(--accent2) 0%, transparent 50%); opacity: .55; }
  .decor-blob .d1 { right: -160px; top: -100px; width: 620px; height: 560px; border-radius: 42% 58% 63% 37% / 45% 40% 60% 55%; background: var(--accent); opacity: .16; }
  .decor-blob .d2 { left: -180px; bottom: -160px; width: 520px; height: 480px; border-radius: 60% 40% 35% 65% / 50% 60% 40% 50%; background: var(--accent2); opacity: .16; }
  .decor-stripes .d1 { left: 0; top: 0; width: 100%; height: 52px; background: repeating-linear-gradient(-45deg, var(--accent) 0 26px, transparent 26px 52px); }
  .decor-stripes .d2 { left: 0; bottom: 0; width: 100%; height: 18px; background: var(--text); }

  /* ---------- เนื้อหา ---------- */
  header { position: relative; display: flex; align-items: center; gap: 18px; }
  .logo { width: 64px; height: 64px; }
  .brand { font-family: var(--mono); font-weight: 600; letter-spacing: .32em; font-size: 22px; color: var(--text); }
  .kicker { margin-left: auto; font-family: var(--mono); font-size: 20px; letter-spacing: .2em; padding: 10px 18px; border: 1.5px solid var(--accent); color: var(--accent); background: color-mix(in srgb, var(--bg) 70%, transparent); }

  main { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: 40px 0; overflow: hidden; }
  main .inner { display: flex; flex-direction: column; gap: 34px; }
  .align-center main .inner { align-items: center; text-align: center; }
  .align-center ul.bullets, .align-center .cards, .align-center .opts, .align-center .pkgs, .align-center .term { text-align: left; align-self: stretch; }
  h1 { font-weight: 700; font-size: 72px; line-height: 1.25; letter-spacing: -.005em; }
  h1 .accent { color: var(--accent); }
  .sub { font-size: 34px; line-height: 1.55; color: color-mix(in srgb, var(--text) 78%, var(--bg)); font-weight: 500; }
  .source { font-family: var(--mono); font-size: 22px; color: var(--muted); letter-spacing: .06em; }

  ul.bullets { list-style: none; display: flex; flex-direction: column; gap: 20px; }
  ul.bullets li { position: relative; padding-left: 56px; font-size: 32px; line-height: 1.5; }
  ul.bullets li::before { content: ''; position: absolute; left: 0; top: 13px; width: 30px; height: 18px; background: var(--accent); transform: skewX(-24deg); }

  .term { background: color-mix(in srgb, var(--bg) 85%, #000); border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .term .bar { display: flex; gap: 10px; padding: 16px 20px; border-bottom: 1.5px solid var(--line); }
  .term .bar i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
  .term pre { font-family: var(--mono); font-size: 26px; line-height: 1.6; padding: 24px 28px; color: var(--accent); white-space: pre-wrap; word-break: break-word; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 26px 28px; font-size: 28px; line-height: 1.45; }
  .card b { display: block; font-family: var(--mono); color: var(--accent); font-size: 20px; letter-spacing: .15em; margin-bottom: 10px; }

  .pkgs { display: grid; gap: 18px; }
  .pkg { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 24px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 26px 30px; }
  .pkg.hl { border-color: var(--accent); }
  .pkg .n { font-size: 32px; font-weight: 600; }
  .pkg .p { font-family: var(--mono); font-size: 40px; font-weight: 600; color: var(--accent); text-align: right; }
  .pkg .s { grid-column: 1 / -1; font-size: 24px; color: var(--muted); line-height: 1.5; }
  .pkg.big { padding: 38px 40px; }
  .pkg.big .p { font-size: 64px; }
  .pkg.big ul.bullets li { font-size: 28px; }

  .fun { border-left: 6px solid var(--accent); padding-left: 40px; }
  .align-center .fun { border-left: 0; padding-left: 0; }
  .fun .prompt { font-family: var(--mono); color: var(--muted); font-size: 26px; margin-bottom: 18px; }
  .fun h1 { font-size: 80px; }
  .fun .punch { margin-top: 40px; font-size: 56px; line-height: 1.4; color: var(--accent); font-weight: 600; }

  .opts { display: grid; gap: 18px; }
  .opt { display: flex; align-items: center; gap: 24px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 12px; padding: 22px 26px; font-size: 32px; }
  .opt b { font-family: var(--mono); width: 54px; height: 54px; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); border-radius: 8px; font-size: 28px; }

  footer { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-top: 28px; border-top: 1.5px solid var(--line); }
  footer .cta { font-size: 30px; font-weight: 600; color: var(--text); }
  footer .tag { font-family: var(--mono); font-size: 20px; color: var(--muted); letter-spacing: .12em; white-space: nowrap; }
</style>
</head>
<body>
<div class="canvas" id="root"></div>
<script>
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const baht = (n) => '฿' + Number(n).toLocaleString('en-US');
  const logo = () => `<svg class="logo" viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="var(--panel)"/>
    <polygon points="22,15 50,15 46,25 18,25" fill="var(--text)"/>
    <polygon points="17,28 45,28 41,37 13,37" fill="var(--accent)"/>
    <polygon points="20,40 48,40 44,49 16,49" fill="var(--text)"/></svg>`;

  // เน้นส่วนท้ายหลังเครื่องหมาย | เป็นสี accent เช่น "ทำเว็บให้ร้าน|ขายได้จริง"
  const headline = (h) => {
    const [a, b] = String(h).split('|');
    return b ? `${esc(a)}<span class="accent">${esc(b)}</span>` : esc(a);
  };
  const bullets = (list) => list?.length ? `<ul class="bullets">${list.map((b) => `<li>${esc(b)}</li>`).join('')}</ul>` : '';
  const sub = (img) => img.subhead ? `<p class="sub">${esc(img.subhead)}</p>` : '';
  const pic = '<div class="pic"></div>';

  const LAYOUTS = {
    tip: (img) => `${pic}<h1>${headline(img.headline)}</h1>${sub(img)}${bullets(img.bullets)}
      ${img.code ? `<div class="term"><div class="bar"><i></i><i></i><i></i></div><pre>${esc(img.code)}</pre></div>` : ''}`,

    news: (img) => `${pic}${img.source ? `<div class="source">ที่มา: ${esc(img.source)}</div>` : ''}
      <h1>${headline(img.headline)}</h1>${sub(img)}${bullets(img.bullets)}`,

    showcase: (img) => `${pic}<h1>${headline(img.headline)}</h1>${sub(img)}
      ${img.bullets?.length ? `<div class="cards">${img.bullets.map((b, i) => `<div class="card"><b>0${i + 1}</b>${esc(b)}</div>`).join('')}</div>` : ''}`,

    package: (img, brand) => {
      const pk = brand.packages;
      if (img.packageId && img.packageId !== 'all') {
        const p = pk.find((x) => x.id === img.packageId) ?? pk[0];
        return `<h1>${headline(img.headline)}</h1>${sub(img)}
          <div class="pkg big hl"><div class="n">${esc(p.name)}</div><div class="p">${baht(p.price)}</div>
            <div class="s">${esc(p.scope)} · ${esc(p.duration)}${p.support ? ` · ดูแลหลังส่งมอบ ${esc(p.support)}` : ''}</div>
            <div style="grid-column:1/-1;margin-top:14px">${bullets(p.features.slice(0, 4))}</div></div>`;
      }
      return `<h1>${headline(img.headline)}</h1>${sub(img)}
        <div class="pkgs">${pk.map((p, i) => `<div class="pkg${i === 1 ? ' hl' : ''}"><div class="n">${esc(p.name)}</div>
          <div class="p">${p.priceNote ? '<span style="font-size:22px;color:var(--muted)">เริ่ม </span>' : ''}${baht(p.price)}</div>
          <div class="s">${esc(p.scope)} · ${esc(p.duration)}</div></div>`).join('')}</div>`;
    },

    fun: (img) => `${pic}<div class="fun"><div class="prompt">$ cat real_life.log</div>
      <h1>${headline(img.headline)}</h1>${img.subhead ? `<div class="punch">${esc(img.subhead)}</div>` : ''}</div>`,

    question: (img) => `${pic}<h1>${headline(img.headline)}</h1>${sub(img)}
      ${img.options?.length ? `<div class="opts">${img.options.map((o, i) => `<div class="opt"><b>${'ABCD'[i]}</b>${esc(o)}</div>`).join('')}</div>` : ''}`,
  };

  async function loadFonts(theme) {
    const families = [theme.font, theme.mono].filter(Boolean);
    const href = `https://fonts.googleapis.com/css2?${families.map((f) => `family=${f.replace(/ /g, '+')}:wght@400;500;600;700`).join('&')}&display=block`;
    await new Promise((resolve) => {
      const link = Object.assign(document.createElement('link'), { rel: 'stylesheet', href, onload: resolve, onerror: resolve });
      document.head.appendChild(link);
      setTimeout(resolve, 8000);
    });
    await Promise.race([
      Promise.all(['400', '600', '700'].map((w) => document.fonts.load(`${w} 40px "${theme.font}"`, 'ไทยAa'))),
      new Promise((r) => setTimeout(r, 8000)),
    ]).catch(() => {});
  }

  window.renderPost = async ({ layout, image, brand, bg, theme }) => {
    const t = theme ?? {};
    const root = document.documentElement.style;
    for (const [k, v] of Object.entries(t.colors ?? {})) root.setProperty(`--${k.replace(/[A-Z]/g, (c) => `-${c.toLowerCase()}`)}`, v);
    if (t.font) root.setProperty('--sans', `'${t.font}', 'Noto Sans Thai', 'Tlwg Typist', sans-serif`);
    if (t.font) await loadFonts(t);

    const photoMode = bg ? (t.photo ?? 'faint') : 'none';
    const canvas = document.getElementById('root');
    canvas.className = `canvas decor-${t.decor ?? 'frame'} photo-${photoMode} align-${t.align ?? 'left'}`;
    const body = (LAYOUTS[layout] ?? LAYOUTS.tip)(image, brand);
    canvas.innerHTML = `
      <div class="bg">${bg ? `<div class="photo" style="background-image:url('${bg}')"></div><div class="shade"></div>` : ''}
        <div class="d1"></div><div class="d2"></div><div class="d3"></div></div>
      <header>${logo()}<span class="brand">STRATA</span>${image.kicker ? `<span class="kicker">${esc(image.kicker)}</span>` : ''}</header>
      <main><div class="inner">${body}</div></main>
      <footer><span class="cta">${esc(image.cta || 'Strata — เว็บไซต์ ระบบ Bot & Automation')}</span><span class="tag">&gt; BUILD ANYTHING_</span></footer>`;
    if (bg) for (const el of canvas.querySelectorAll('.pic')) el.style.backgroundImage = `url('${bg}')`;
    if (photoMode !== 'card') for (const el of canvas.querySelectorAll('.pic')) el.remove();
    return document.fonts.ready;
  };

  // ย่อเนื้อหาถ้าล้นกรอบ
  window.fitContent = () => {
    const main = document.querySelector('main');
    const inner = main.querySelector('.inner');
    const avail = main.clientHeight - 80;
    let scale = 1;
    while (inner.getBoundingClientRect().height > avail && scale > 0.55) {
      scale -= 0.05;
      inner.style.zoom = scale;
    }
    return { overflow: inner.getBoundingClientRect().height > avail, scale };
  };
</script>
</body>
</html>
