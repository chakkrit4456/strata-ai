# หมวดเนื้อหา — kind: value (ให้ประโยชน์/สนุก) หรือ promo (โปรโมทบริการ)
# weight ใช้สุ่มเลือกหมวดในประเภทเดียวกัน
promoRatio: 0.3        # เป้าสัดส่วนโพสต์โปรโมทของเพจ (ย้อนหลัง 14 โพสต์)
maxPromoPerDay: 1

pillars:
  - id: trend
    kind: value
    weight: 3
    template: news
    label: ข่าว/เทรนด์ล่าสุด
    brief: >-
      หยิบข่าวเทคโนโลยีหรือธุรกิจล่าสุด 1 ข่าวจากรายการข่าวที่ให้ มาสรุปด้วยภาษาของเราเอง (ห้ามคัดลอก)
      แล้วบอกว่าเรื่องนี้กระทบเจ้าของธุรกิจ/คนทำงาน IT ในไทยอย่างไร หรือควรทำอะไรต่อ อ้างที่มาของข่าวเสมอ
  - id: tip
    kind: value
    weight: 3
    template: tip
    label: ทิป/ความรู้ IT ใช้ได้จริง
    brief: >-
      ทิปสั้นที่ใช้ได้จริงเกี่ยวกับเว็บ, ฐานข้อมูล, Linux/เซิร์ฟเวอร์, Git, API, ความปลอดภัยพื้นฐาน,
      หรือการเลือกเทคโนโลยีให้ธุรกิจเล็ก มีตัวอย่างโค้ดหรือคำสั่งสั้นๆ ได้ ต้องถูกต้องทางเทคนิค
  - id: fun
    kind: value
    weight: 2
    template: fun
    label: เรื่องขำ/มีมสายเดฟ
    brief: >-
      เรื่องขำที่คนทำงาน IT/dev เจอจริง เช่น ลูกค้าขอแก้ "นิดเดียว", deploy วันศุกร์, bug ที่หายเองตอนมีคนดู
      เป็นมิตร ไม่ด่าใคร ไม่ล้อเลียนกลุ่มคน จบด้วยคำถามชวนคอมเมนต์
  - id: question
    kind: value
    weight: 1.5
    template: question
    label: ชวนคุย/โพล
    brief: >-
      คำถามปลายเปิดหรือโพลให้คนในกลุ่มแชร์ประสบการณ์ เช่น stack ที่ชอบ, เครื่องมือที่ใช้ทุกวัน,
      ปัญหาที่เจอกับระบบในองค์กร ให้ตัวเลือก 2–4 ข้อ
  - id: story
    kind: value
    weight: 1.5
    template: tip
    label: บทเรียนจากการทำงานจริง
    brief: >-
      บทเรียนเชิงเทคนิคจากงาน IT ในสถานศึกษา หรือจากการพัฒนาระบบประเภทที่อยู่ในผลงาน
      (เช่น สิ่งที่ต้องคิดตอนออกแบบฐานข้อมูลระบบสต็อก) เล่าแบบไม่โอ้อวด ไม่อ้างชื่อลูกค้า
  - id: banner
    kind: promo
    weight: 1.5
    template: banner
    label: แบนเนอร์แนะนำแบรนด์/บริการ
    brief: >-
      โพสต์แบบแบนเนอร์ที่บอกว่าเราคือใครและทำอะไรได้ เลือกโฟกัส 1 อย่าง: แนะนำ Strata ทั้งแบรนด์,
      หรือบริการ/ระบบ 1 ตัวจากข้อมูล (เช่น ระบบสต็อก, เว็บร้านค้า, Bot & Automation) ตั้งชื่อเรียกให้จำง่าย
      มีสโลแกนสั้นๆ และความสามารถหลัก 4 ข้อจากข้อมูลจริงเท่านั้น
  - id: showcase
    kind: promo
    weight: 1
    template: showcase
    label: โชว์ผลงาน
    brief: >-
      เล่าว่าระบบประเภทหนึ่งจากรายการผลงานแก้ปัญหาอะไร มีฟีเจอร์อะไร เหมาะกับธุรกิจแบบไหน
      แล้วชวนทักมาคุย/ประเมินราคาฟรี ห้ามแต่งชื่อลูกค้าหรือตัวเลขผลลัพธ์
  - id: package
    kind: promo
    weight: 1
    template: package
    label: แนะนำแพ็กเกจ
    brief: >-
      แนะนำแพ็กเกจ 1 ตัว (หรือเทียบทั้ง 3) ด้วยราคาและขอบเขตตามข้อมูลจริงเท่านั้น
      เน้นว่าเหมาะกับใคร และขั้นตอนเริ่มงานง่าย ประเมินราคาฟรี
